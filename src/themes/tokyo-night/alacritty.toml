[window]
decorations = "None"
padding.x = 12
padding.y = 12

[font]
size = 12.0

[keyboard]
bindings = [
  { key = "=", mods = "Control", action = "None" },
  { key = "+", mods = "Control", action = "None" },
  { key = "-", mods = "Control", action = "None" },
  { key = "0", mods = "Control", action = "None" },
  { key = "NumpadAdd", mods = "Control", action = "None" },
  { key = "NumpadSubtract", mods = "Control", action = "None" },
  { key = "Numpad0", mods = "Control", action = "None" },
  { key = "=", mods = "Control|Shift", action = "None" },
  { key = "+", mods = "Control|Shift", action = "None" },
  { key = "-", mods = "Control|Shift", action = "None" },
  { key = "0", mods = "Control|Shift", action = "None" },
  { key = "Equals", mods = "Control", action = "None" },
  { key = "Plus", mods = "Control", action = "None" },
  { key = "Minus", mods = "Control", action = "None" },
  { key = "Key0", mods = "Control", action = "None" },
  { key = "Equals", mods = "Control|Shift", action = "None" },
  { key = "Plus", mods = "Control|Shift", action = "None" },
  { key = "Minus", mods = "Control|Shift", action = "None" },
  { key = "Key0", mods = "Control|Shift", action = "None" },
]

[mouse]
bindings = [
  { mouse = "WheelUp", mods = "Control", action = "None" },
  { mouse = "WheelDown", mods = "Control", action = "None" },
]

[colors]
[colors.primary]
background = '#1a1b26'
foreground = '#a9b1d6'

# Normal colors
[colors.normal]
black = '#32344a'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#ad8ee6'
cyan = '#449dab'
white = '#787c99'

# Bright colors
[colors.bright]
black = '#444b6a'
red = '#ff7a93'
green = '#b9f27c'
yellow = '#ff9e64'
blue = '#7da6ff'
magenta = '#bb9af7'
cyan = '#0db9d7'
white = '#acb0d0'

[colors.selection]
background = '#7aa2f7'
